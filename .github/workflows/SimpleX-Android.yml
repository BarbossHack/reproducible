name: SimpleX-Android

on:
  workflow_dispatch:
    inputs:
      VERSION:
        description: "VERSION"
        required: true

run-name: "Check ${{ github.workflow }} v${{ inputs.VERSION }} reproducibility"

jobs:
  github-build:
    runs-on: jj
    timeout-minutes: 2880
    steps:
      - name: Build
        run: |
          rm -rf *
          curl -LO "https://raw.githubusercontent.com/simplex-chat/simplex-chat/refs/heads/master/scripts/simplex-chat-reproduce-builds-android.sh"
          chmod +x simplex-chat-reproduce-builds-android.sh
          yes | ./simplex-chat-reproduce-builds-android.sh "v${{ inputs.VERSION }}" || touch ./v${{ inputs.VERSION }}-simplex-chat/failure
          ls -lsah
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          path: ./v${{ inputs.VERSION }}-simplex-chat/

  github-verify:
    needs: [github-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: v${{ inputs.VERSION }}-simplex-chat
      - run: ls -lsahR
      - uses: BarbossHack/reproducible/.github/actions/apkdiff@master
        with:
          APKS_A: |-
            v${{ inputs.VERSION }}-simplex-chat/android/simplex-aarch64.apk.built
            v${{ inputs.VERSION }}-simplex-chat/android/simplex-armv7a.apk.built
          APKS_B: |-
            v${{ inputs.VERSION }}-simplex-chat/android/simplex-aarch64.apk.downloaded
            v${{ inputs.VERSION }}-simplex-chat/android/simplex-armv7a.apk.downloaded
          IGNORE_FILES: |-
            META-INF/KEY0.RSA
            META-INF/KEY0.SF
      - name: Check reproducibility
        run: |
          if [ -f ./v${{ inputs.VERSION }}-simplex-chat/failure ]; then
            echo "Reproducibility check failed"
            exit 1
          fi

  notify:
    needs: [github-verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: BarbossHack/reproducible/.github/actions/discord-webhook@master
        with:
          VERSION: ${{ inputs.VERSION }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          needs: ${{ toJSON(needs) }}
